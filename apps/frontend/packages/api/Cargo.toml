[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
content_core = { workspace = true }
once_cell = "1.21.3"
redis = { version = "1.0.3", features = ["aio", "tokio-rustls-comp", "tls-rustls"], optional = true }
dotenvy = { version = "0.15.7", optional = true }
rustls = { version = "0.23.36", default-features = false, features = ["std", "aws_lc_rs"], optional = true }

[features]
server = ["dioxus/server", "content_core/server", "dep:redis", "dep:dotenvy", "dep:rustls"]
