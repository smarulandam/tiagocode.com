[package]
name = "content_core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.86"
chrono = { version = "0.4.40", features = ["serde"] }
derive_builder = "0.20.2"
derive-getters = "0.5.0"
itertools = "0.14.0"
lazy_static = "1.5.0"
regex = "1.11.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
thiserror = "2.0.11"
uuid = { version = "1.15", features = ["v4", "serde", "js"] }
redis = { version = "1.0.3", features = ["aio", "tokio-rustls-comp", "tls-rustls"], optional = true }
reqwest = { version = "0.13.2", features = ["json"], optional = true }
secrecy = { version = "0.10.3", optional = true }
serde_json_path_to_error = { version = "0.1.4", optional = true }
voca_rs = { version = "1.15.2", optional = true }

[dev-dependencies]
mockito = "1.6.1"
rstest = "0.26.1"
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = []
server = [
    "dep:redis",
    "dep:reqwest",
    "dep:secrecy",
    "dep:serde_json_path_to_error",
    "dep:voca_rs",
]
