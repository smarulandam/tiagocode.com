name: Build & Publish Backoffice Image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to GHCR"
        required: true
        type: boolean
        default: true
  push:
    branches: ["main"]
    paths:
      - "apps/backoffice/**"

concurrency:
  group: backoffice-image-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare build context
    runs-on: ubuntu-latest
    outputs:
      base_image_name: ${{ steps.context.outputs.base_image_name }}
      base_image_version: ${{ steps.context.outputs.base_image_version }}
      should_push: ${{ steps.context.outputs.should_push }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source ops/base_images/php-8.4/version.env
          set +a

          should_push=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${{ github.event.inputs.push_image || '' }}" == "true" ]]; then
            should_push=true
          fi

          echo "base_image_name=${BASE_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "base_image_version=${BASE_IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "should_push=${should_push}" >> "$GITHUB_OUTPUT"

  build_and_publish:
    name: Build and publish backoffice image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: needs.prepare.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/smarulandam/tiagocode.com/backoffice
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.base.name=${{ needs.prepare.outputs.base_image_name }}
            io.tiagocode.base-image.version=${{ needs.prepare.outputs.base_image_version }}

      - name: Build and push image
        if: needs.prepare.outputs.should_push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backoffice
          file: ./apps/backoffice/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE_NAME=${{ needs.prepare.outputs.base_image_name }}
            BASE_IMAGE_VERSION=${{ needs.prepare.outputs.base_image_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/smarulandam/tiagocode.com/backoffice:buildcache
          cache-to: type=registry,ref=ghcr.io/smarulandam/tiagocode.com/backoffice:buildcache,mode=max

      - name: Build image only (no push)
        if: needs.prepare.outputs.should_push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backoffice
          file: ./apps/backoffice/Dockerfile
          push: false
          build-args: |
            BASE_IMAGE_NAME=${{ needs.prepare.outputs.base_image_name }}
            BASE_IMAGE_VERSION=${{ needs.prepare.outputs.base_image_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
